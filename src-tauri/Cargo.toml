[package]
name = "drivetooth"
version = "0.1.0"
description = "In-place per-file drive encryption with password-gated volumes"
edition = "2021"
rust-version = "1.80"

[lib]
name = "drivetooth_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["gui"]
# The encryption engine has no business depending on a webview, so keeping the GUI behind
# a feature lets `cargo test --no-default-features` exercise the whole core in seconds.
gui = ["dep:tauri"]

[dependencies]
tauri = { version = "2", optional = true , features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
zeroize = "1"
thiserror = "2"
walkdir = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
